spring.application.name=techstore
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# =========================
# Groq AI
# =========================
groq.api-key=${GROQ_API_KEY}


# =========================
# VNPay Sandbox
# =========================
payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.return-url=http://localhost:8081/api/payments/vnpay/return
payment.vnpay.ipn-url=http://localhost:8081/api/payments/vnpay/ipn

payment.vnpay.tmn-code=${VNPAY_TMN_CODE}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET}

payment.vnpay.version=2.1.0
payment.vnpay.command=pay
payment.vnpay.order-type=other
payment.vnpay.locale=vn
payment.vnpay.currency-code=VND
payment.vnpay.expire-minutes=15
payment.vnpay.time-zone=Asia/Ho_Chi_Minh